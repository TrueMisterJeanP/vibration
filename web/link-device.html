<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="referrer" content="no-referrer">
  <script src="/js/theme.js?v=group-clean-overlap-v405"></script>
  <title>Vibration · Validation d’un appareil</title>
  <link rel="icon" type="image/svg+xml" href="/icons/vibration.svg">
  <link rel="alternate icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=group-clean-overlap-v405">
</head>
<body class="auth-page">
  <div class="desktop-titlebar-drag-region" data-tauri-drag-region aria-hidden="true" data-title="Vibration"></div>
  <main class="auth-card link-device-card">
    <div class="brand large"><img class="brand-app-icon" src="/icons/vibration.svg" alt=""><div><strong>Vibration</strong><small>Validation sécurisée d’un appareil</small></div></div>
    <h1>Autoriser ce nouvel appareil ?</h1>
    <p id="link-device-introduction">Vérification de la demande en cours…</p>
    <section id="link-device-summary" class="link-device-summary" hidden>
      <strong id="link-device-name"></strong>
      <small id="link-device-type"></small>
      <small id="link-device-address"></small>
      <small id="link-device-expiry"></small>
    </section>
    <p id="link-device-status" role="status"></p>
    <div class="link-device-actions">
      <button id="link-device-approve" type="button" hidden>Autoriser cet appareil</button>
      <a id="link-device-return" class="button-link outline-link" href="/">Retourner à Vibration</a>
    </div>
  </main>
  <script type="module" src="/js/link-device.js?v=community-1-0-28-v412"></script>
</body>
</html>
